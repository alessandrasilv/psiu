version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: psiu_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: psiu
      MYSQL_USER: ale
      MYSQL_PASSWORD: '123456'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: