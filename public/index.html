<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psiu - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-login">
        <div class="card-form">
            <h2>Psiu - Entrar</h2>
            <form action="/psiu/login" method="post" id="login">
                <div class="form-group">
                    <label for="email">Email: </label>
                    <input type="email" id="email" name="email" required placeholder="admin@psiu.com">
                </div>

                <div class="form-group">
                    <label for="senha">Senha: </label>
                    <input type="password" id="senha" name="senha" required placeholder="123456">
                </div>

                <button type="submit">Entrar</button>
            </form>
        </div>
    </div>

    <script>
        const formLogin = document.getElementById("login");

        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(formLogin);
            const dados = Object.fromEntries(formData);

            try {
                const response = await fetch('/psiu/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json'},
                    body: JSON.stringify(dados)
                });

                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('usuarioLogado', JSON.stringify(data.usuario));
                    alert(data.message);
                    window.location.href = '/dashboard.html';
                } else {
                    alert(data.message);
                }
            } catch (error) {
                alert('Não foi possível conectar ao servidor.');
            }
        });
    </script>
</body>
</html>
